<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CREATIVES | Visual Art & Design</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient-start: #fbc2eb;
            --bg-gradient-end: #f8b5cb;
            --glass-bg: rgba(255, 255, 255, 0.25);
            --glass-border: rgba(255, 255, 255, 0.4);
            --pink-glow: 0 15px 35px rgba(232, 124, 159, 0.2);
            --text-pink: #ec86a7; /* Exact pink from the design */
            --white-card: #ffffff;
        }

        /* Smooth scrolling for the whole page */
        html {
            scroll-behavior: smooth;
        }

        body.creatives-page {
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            min-height: 100vh;
            margin: 0;
            padding: 60px 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        /* Decorative Background Blend Shapes */
        .blend-shape {
            position: fixed;
            pointer-events: none;
            z-index: 0;
            opacity: 0.9;
        }
        .blend-top-left {
            top: 2%;
            left: 2%;
            width: 250px;
        }
        .blend-mid-right {
            top: 40%;
            right: -80px;
            width: 220px;
        }
        .blend-bottom-left {
            bottom: 5%;
            left: 15%;
            width: 180px;
        }

        /* Main Container - WIDENED FOR LAPTOP */
        .page-container {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 40px;
            box-shadow: var(--pink-glow);
            width: 100%;
            max-width: 850px; /* Much wider and responsive for desktop */
            position: relative;
            z-index: 1;
            margin: 0 auto;
        }

        /* Header Section */
        .main-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
            padding: 0 10px;
        }
        .page-title {
            font-size: 36px;
            color: #ffffff;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        .close-btn {
            color: #111;
            transition: transform 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            opacity: 0.8;
            background: transparent;
        }
        .close-btn:hover {
            transform: scale(1.15) rotate(90deg);
            opacity: 1;
        }

        /* White Cards - EXACTLY LIKE IMAGE */
        .creative-section {
            background: var(--white-card);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.04);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s ease;
            display: flex;
            flex-direction: column;
        }
        .creative-section:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(232, 124, 159, 0.15);
        }

        /* Grid Alignment */
        .image-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 18px; /* Space between images and label */
        }
        
        .img-wrapper {
            border-radius: 10px;
            overflow: hidden;
            background: #f8f8f8;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .img-wrapper img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        .img-wrapper:hover img {
            transform: scale(1.08);
        }

        /* Aspect Ratios for Grid */
        .square-grid .img-wrapper {
            aspect-ratio: 1 / 1;
        }
        
        .portrait-grid {
            align-items: stretch; /* Stretches items to be same height */
        }
        .portrait-grid .img-wrapper {
            aspect-ratio: 3 / 4; /* Keeps portrait images looking good */
        }

        /* Label inside the white card */
        .section-label {
            font-size: 16px;
            font-weight: 900;
            color: var(--text-pink);
            text-transform: uppercase;
            margin: 0;
            letter-spacing: 0.5px;
            padding-left: 5px;
        }

        /* Reels Pill Button */
        .reels-section {
            background: var(--white-card);
            border-radius: 50px;
            padding: 22px 25px;
            text-align: left;
            margin-bottom: 0;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0,0,0,0.04);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: block;
            text-decoration: none;
        }
        .reels-section:hover {
            transform: translateY(-3px) scale(1.01);
            box-shadow: 0 12px 30px rgba(232, 124, 159, 0.15);
        }
        .reels-label {
            font-size: 16px;
            font-weight: 900;
            color: var(--text-pink);
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding-left: 5px;
        }

        /* Responsive adjustments for Mobile & Tablets */
        @media (max-width: 768px) {
            .page-container {
                max-width: 95%;
                padding: 30px 20px;
            }
            .page-title {
                font-size: 30px;
            }
        }

        @media (max-width: 480px) {
            body.creatives-page {
                padding: 20px 10px;
            }
            .page-container {
                padding: 20px 15px;
                border-radius: 20px;
            }
            .page-title {
                font-size: 24px;
            }
            .creative-section {
                padding: 15px;
            }
            .image-grid {
                gap: 10px;
                margin-bottom: 12px;
            }
            .section-label, .reels-label {
                font-size: 14px;
            }
        }
    </style>
</head>
<body class="creatives-page">
    <div id="page-transition">
    <div class="background-overlay"></div>
    
    <img src="assets/ELEMENTS/Blend Group 2.svg" alt="" class="blend-shape blend-top-left">
    <img src="assets/ELEMENTS/Blend Group 2.svg" alt="" class="blend-shape blend-mid-right">
    <img src="assets/ELEMENTS/Blend Group 2.svg" alt="" class="blend-shape blend-bottom-left">

    <main class="page-container gs-reveal">
        
        <header class="main-header">
            <h1 class="page-title">CREATIVES</h1>
            <a href="index.html" class="close-btn" aria-label="Close">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </a>
        </header>

        <section class="creative-section gs-reveal">
            <div class="image-grid square-grid">
                <div class="img-wrapper"><img src="assets/ELEMENTS/CREATIVES/SINGLE P 1.jpg" alt="Single Post 1"></div>
                <div class="img-wrapper"><img src="assets/ELEMENTS/CREATIVES/SINGLE P 2'.jpg" alt="Single Post 2"></div>
                <div class="img-wrapper"><img src="assets/ELEMENTS/CREATIVES/SINGLE P3.jpg" alt="Single Post 3"></div>
            </div>
            <h2 class="section-label">SINGLE POSTS</h2>
        </section>

        <section class="creative-section gs-reveal">
            <div class="image-grid square-grid">
                <div class="img-wrapper"><img src="assets/ELEMENTS/CREATIVES/CAROUSEL 1.png" alt="Carousel 1"></div>
                <div class="img-wrapper"><img src="assets/ELEMENTS/CREATIVES/CAROUSEL 2.png" alt="Carousel 2"></div>
                <div class="img-wrapper"><img src="assets/ELEMENTS/CREATIVES/CAROUSEL 3.png" alt="Carousel 3"></div>
            </div>
            <h2 class="section-label">CAROUSELS</h2>
        </section>

        <section class="creative-section gs-reveal">
            <div class="image-grid portrait-grid">
                <div class="img-wrapper"><img src="assets/ELEMENTS/CREATIVES/FESTIVES1.jpg" alt="Festive 1"></div>
                <div class="img-wrapper"><img src="assets/ELEMENTS/CREATIVES/FESTIVES 2.png" alt="Festive 2"></div>
                <div class="img-wrapper"><img src="assets/ELEMENTS/CREATIVES/FESTIVES 3.png" alt="Festive 3"></div>
            </div>
            <h2 class="section-label">FESTIVES</h2>
        </section>

        <section class="creative-section gs-reveal">
            <div class="image-grid portrait-grid">
                <div class="img-wrapper"><img src="assets/ELEMENTS/CREATIVES/FREELANCE 01 .png" alt="Freelance 1"></div>
                <div class="img-wrapper"><img src="assets/ELEMENTS/CREATIVES/FREE LANCE 02.png" alt="Freelance 2"></div>
                <div class="img-wrapper"><img src="assets/ELEMENTS/CREATIVES/FREELANCE03.png" alt="Freelance 3"></div>
            </div>
            <h2 class="section-label">FREELANCE</h2>
        </section>

        <a href="#" class="reels-section gs-reveal">
            <h2 class="reels-label">REELS (CLICK TO OPEN)</h2>
        </a>

    </main>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script>
        gsap.registerPlugin(ScrollTrigger);

        const revealElements = gsap.utils.toArray('.gs-reveal');
        
        revealElements.forEach((el, index) => {
            gsap.fromTo(el, 
                { y: 40, opacity: 0 },
                {
                    y: 0,
                    opacity: 1,
                    duration: 0.8,
                    delay: index * 0.05, 
                    ease: "back.out(1.2)", // Bouncy smooth effect
                    scrollTrigger: {
                        trigger: el,
                        start: "top 90%", // Triggers nicely when entering viewport
                        toggleActions: "play none none reverse"
                    }
                }
            );
        });
    </script>
    <script src="main.js"></script>
</body>
</html>
