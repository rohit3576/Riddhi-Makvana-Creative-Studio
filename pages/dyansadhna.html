            <p class="section-label" style="font-size: 18px; color: var(--accent-pink);">IDENTITY & BRANDING</p>
        </header>

        <div class="content-box" style="width: 1038px; padding: 40px;">
            <!-- Visual Identity -->
            <section class="creative-section" style="width: 957px; margin: 0 auto; background: var(--glass-bg); border-radius: 28px; padding: 40px; border: 1px solid var(--glass-border);">
                <h2 class="section-label" style="margin-bottom: 30px;">VISUAL IDENTITY</h2>
                <div class="image-grid" style="grid-template-columns: repeat(3, 1fr); gap: 20px;">
                    <div class="image-card" style="padding: 10px; border-radius: 23px;">
                        <div class="img-wrapper" style="border-radius: 15px;"><img src="../assets/ELEMENTS/DYANSADHNA/PRIMARY LOGO.svg" alt="Primary Logo"></div>
                        <p class="section-label" style="font-size: 12px; margin-top: 10px;">PRIMARY LOGO</p>
                    </div>
                    <div class="image-card" style="padding: 10px; border-radius: 23px;">
                        <div class="img-wrapper" style="border-radius: 15px;"><img src="../assets/ELEMENTS/DYANSADHNA/SECONDARY LOGO.png" alt="Secondary Logo"></div>
                        <p class="section-label" style="font-size: 12px; margin-top: 10px;">SECONDARY LOGO</p>
                    </div>
                    <div class="image-card" style="padding: 10px; border-radius: 23px;">
                        <div class="img-wrapper" style="border-radius: 15px;"><img src="../assets/ELEMENTS/DYANSADHNA/OCCURANCE OF LOGO.png" alt="Logo Usage"></div>
                        <p class="section-label" style="font-size: 12px; margin-top: 10px;">LOGO OCCURRENCE</p>
                    </div>
                </div>
            </section>

            <!-- Stationery -->
            <section class="creative-section" style="width: 957px; margin: 0 auto; background: var(--glass-bg); border-radius: 28px; padding: 40px; border: 1px solid var(--glass-border);">
                <h2 class="section-label" style="margin-bottom: 30px;">STATIONERY</h2>
                <div class="image-grid" style="grid-template-columns: repeat(3, 1fr); gap: 20px;">
                    <div class="image-card" style="padding: 10px; border-radius: 23px;">
                        <div class="img-wrapper" style="border-radius: 15px;"><img src="../assets/ELEMENTS/DYANSADHNA/BUSINESS CARD.png" alt="Business Card"></div>
                        <p class="section-label" style="font-size: 12px; margin-top: 10px;">BUSINESS CARD</p>
                    </div>
                    <div class="image-card" style="padding: 10px; border-radius: 23px;">
                        <div class="img-wrapper" style="border-radius: 15px;"><img src="../assets/ELEMENTS/DYANSADHNA/ID CARD.png" alt="ID Card"></div>
                        <p class="section-label" style="font-size: 12px; margin-top: 10px;">ID CARD</p>
                    </div>
                    <div class="image-card" style="padding: 10px; border-radius: 23px;">

                    </div>
                </div>
            </section>

            <section class="creative-section" style="width: 993px; margin: 0 auto; background: var(--glass-bg); border-radius: 28px; padding: 40px; border: 1px solid var(--glass-border);">

                <div class="image-grid" style="grid-template-columns: repeat(4, 1fr); gap: 15px;">
                    <div class="image-card" style="padding: 5px; border-radius: 12px;"><div class="img-wrapper" style="border-radius: 8px;"><img src="../assets/ELEMENTS/DYANSADHNA/TVC STORYBOARD/O1.png" alt="Frame 1"></div></div>
                    <div class="image-card" style="padding: 5px; border-radius: 12px;"><div class="img-wrapper" style="border-radius: 8px;"><img src="../assets/ELEMENTS/DYANSADHNA/TVC STORYBOARD/02.png" alt="Frame 2"></div></div>
