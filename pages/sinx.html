<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project - S!NX</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="sinx-page">
    <div class="background-gradient"></div>

    <nav class="navbar">
        <ul class="nav-links">
            <li><a href="index.html">HOME</a></li>
            <li><a href="astris.html">ASTRIS</a></li>
            <li><a href="creatives.html">CREATIVES</a></li>
            <li><a href="dyansadhna.html">DYANSADHNA</a></li>
            <li><a href="sinx.html" class="active">S!NX</a></li>
        </ul>
    </nav>

    <main class="page-container">
        <header class="main-header" style="text-align: center; margin-bottom: 60px;">
            <h1 class="page-title" style="font-size: 48px; letter-spacing: 2px;">S!NX (SNITCH)</h1>
            <p class="section-label" style="font-size: 18px; color: var(--accent-pink);">CAMPAIGN CONCEPT & PACKAGING</p>
        </header>

        <div class="content-box" style="width: 1038px; padding: 40px;">
            <!-- Video Section -->
            <section class="creative-section" style="width: 957px; margin: 0 auto;">
                <h2 class="section-label" style="margin-bottom: 30px;">TVC COMMERCIAL</h2>
                <div class="video-container" style="border-radius: 41px; overflow: hidden; box-shadow: 0 10px 30px rgba(255, 134, 168, 0.4); border: 4px solid var(--glass-border); width: 100%;">
                    <video width="100%" height="auto" controls autoplay muted loop>
                        <source src="../assets/ELEMENTS/VIDEOS/S!NX TVC.mp4" type="video/mp4">
                        Your browser does not support the video tag.
                    </video>
                </div>
            </section>

            <!-- Campaign Section -->
            <section class="creative-section" style="width: 957px; margin: 0 auto; background: var(--glass-bg); border-radius: 28px; padding: 40px; border: 1px solid var(--glass-border);">
                <h2 class="section-label" style="margin-bottom: 30px;">CAMPAIGN VISUALS</h2>
                <div class="image-grid" style="grid-template-columns: repeat(3, 1fr); gap: 20px;">
                    <div class="image-card" style="padding: 10px; border-radius: 23px;">
                        <div class="img-wrapper" style="border-radius: 15px;"><img src="../assets/ELEMENTS/SNITCH/CAMAPIGN CONCEPT.png" alt="Campaign Concept"></div>
                        <p class="section-label" style="font-size: 12px; margin-top: 10px;">CONCEPT VISUAL</p>
                    </div>
                    <div class="image-card" style="padding: 10px; border-radius: 23px;">
                        <div class="img-wrapper" style="border-radius: 15px;"><img src="../assets/ELEMENTS/SNITCH/THE OG.png" alt="The OG"></div>
                        <p class="section-label" style="font-size: 12px; margin-top: 10px;">THE OG SERIES</p>
                    </div>
                    <div class="image-card" style="padding: 10px; border-radius: 23px;">
                        <div class="img-wrapper" style="border-radius: 15px;"><img src="../assets/ELEMENTS/SNITCH/GLOW.png" alt="Glow Effect"></div>
                        <p class="section-label" style="font-size: 12px; margin-top: 10px;">GLOW CAMPAIGN</p>
                    </div>
                </div>
            </section>

            <!-- Packaging Section -->
            <section class="creative-section" style="width: 957px; margin: 0 auto; background: var(--glass-bg); border-radius: 28px; padding: 40px; border: 1px solid var(--glass-border);">
                <h2 class="section-label" style="margin-bottom: 30px;">PACKAGING DESIGN</h2>
                <div class="image-grid" style="grid-template-columns: repeat(2, 1fr); gap: 25px;">
                    <div class="image-card" style="padding: 10px; border-radius: 23px;">
                        <div class="img-wrapper" style="border-radius: 15px; aspect-ratio: 16/9;"><img src="../assets/ELEMENTS/SNITCH/PACKAGING.png" alt="Packaging"></div>
                        <p class="section-label" style="font-size: 12px; margin-top: 10px;">PREMIUM PACKAGING</p>
                    </div>
                    <div class="image-card" style="padding: 10px; border-radius: 23px;">
                        <div class="img-wrapper" style="border-radius: 15px; aspect-ratio: 16/9;"><img src="../assets/ELEMENTS/SNITCH/SWTICH.jpg" alt="Switch"></div>
                        <p class="section-label" style="font-size: 12px; margin-top: 10px;">SWITCH SERIES</p>
                    </div>
                </div>
            </section>

            <!-- Final Identity -->
            <section class="creative-section" style="width: 957px; margin: 0 auto; background: #000; border-radius: 28px; padding: 60px; border: 4px solid var(--glass-border);">
                <div class="img-wrapper" style="aspect-ratio: 3/1; background: transparent; box-shadow: none; display: flex; align-items: center; justify-content: center;">
                    <img src="../assets/ELEMENTS/SNITCH/SINXfinal.svg" alt="S!NX Final Logo" style="width: 60%; height: auto; filter: none;">
                </div>
            </section>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-bar">
            <p class="footer-text">© 2026 RIDZ PORTFOLIO - ALL RIGHTS RESERVED</p>
        </div>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="../main.js"></script>
</body>
</html>
