<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Painting | Riddhi Makvana</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
</head>
<body class="digital-painting-page">
    <div class="page-transition"></div>
    <div id="page-transition">
        <div class="background-overlay"></div>

        <main class="page-container">
            <!-- Decorative Blend Shapes -->
            <div class="blend-shape" style="top: -60px; left: -80px; width: 300px; opacity: 0.6; filter: blur(3px);">
                <img src="assets/ELEMENTS/Blend Group 2.svg" alt="" style="width: 100%;">
            </div>
            <div class="blend-shape" style="top: 40%; right: -100px; width: 250px; opacity: 0.5; filter: blur(4px);">
                <img src="assets/ELEMENTS/Blend Group 2.svg" alt="" style="width: 100%;">
            </div>
            <div class="blend-shape" style="bottom: -40px; left: -40px; width: 150px; opacity: 0.4; filter: blur(2px);">
                <img src="assets/ELEMENTS/Blend Group 2.svg" alt="" style="width: 100%;">
            </div>

            <header class="main-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
                <h1 class="page-title serif" style="font-size: 32px; color: #fff; text-transform: uppercase; margin: 0;">DIGITAL PAINTING</h1>
                <a href="index.html" class="close-btn" style="color: #111; transition: 0.3s ease; opacity: 0.8;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </a>
            </header>

            <div class="content-box">
                <!-- Family Photo Section -->
                <div class="paint-card gs-reveal">
                    <img src="assets/ELEMENTS/DIGITAL PAINTING/FAMILY P.jpg" alt="Family Photo">
                    <p class="paint-label">FAMILY PHOTO</p>
                </div>

                <!-- 7 Horses Section -->
                <div class="paint-card gs-reveal">
                    <img src="assets/ELEMENTS/DIGITAL PAINTING/HORSE P.png" alt="7 Horses Painting">
                    <p class="paint-label">7 HORSES PAINTING (related to vastushastra)</p>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script>
        gsap.registerPlugin(ScrollTrigger);

        const revealElements = gsap.utils.toArray('.gs-reveal');
        
        revealElements.forEach((el, index) => {
            gsap.fromTo(el, 
                { y: 40, opacity: 0 },
                {
                    y: 0,
                    opacity: 1,
                    duration: 0.8,
                    delay: index * 0.1, 
                    ease: "power2.out",
                    scrollTrigger: {
                        trigger: el,
                        start: "top 90%",
                        toggleActions: "play none none reverse"
                    }
                }
            );
        });
    </script>
    <script src="main.js"></script>
</body>
</html>
